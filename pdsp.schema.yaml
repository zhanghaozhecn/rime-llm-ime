# 拼读双拼方案（rime-llm-ime 新项目版）
# 在通用版基础上启用原生 LLM 候选重排组件（llm_filter，C++ 编译进 rime.dll）：
#   - filters 加 llm_filter（位置：uniquifier 之后，pin_fix 固顶优先不受影响）
#   - 移除 lua 版 lua_filter@*llm_filter（C++ 版生效时避免双重重排）
#   - llm_rerank 配置节（参数与旧项目 llm_rerank 默认值相同）
# 通用版方案（无 LLM 痕迹）见拼读双拼项目 配置文件/pdsp.schema.yaml
schema:
  schema_id: pdsp
  name: 拼读双拼
  version: 20260713
  author:
  description: 51声介，44韵调（+ong-eng）
  dependencies:

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  #- name: simplification
  #  states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - lua_processor@*llm_processor
    - lua_processor@*key_extra_processor
    - lua_processor@*word_length_split_processor
    - key_binder
    - lua_processor@*pin_fix_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier
    - llm_filter          # 原生 LLM 重排（rime-llm-ime 项目，C++ 编译进 rime.dll）
    - lua_filter@*hint_filter
    - lua_filter@*word_length_split_filter
    - lua_filter@*pin_fix_filter
    - lua_filter@*no_match_placeholder
    #- simplifier

# LLM 候选重排配置（llm_filter 原生组件读取；参数与旧项目默认相同）
llm_rerank:
  backend: cpu          # off | cpu | gpu — off 时组件透传（不推理）。cpu/gpu 均 CPU 推理
  min_code_len: 4       # 输入编码长度小于此值时不重排
  min_tokens: 1         # 上文 token 数小于此值时不推理（0 = 空上文也推理）
  max_tokens: 10        # 上文 token 上限，超出时从末尾截断
  max_candidates: 5     # 参与打分的候选数上限（其余按原序接尾）
  cpu_cores: 7          # 推理线程数（实测多台机器均在 7 饱和）
  model_path: d:/gguf_models/Qwen3.5-0.8B-Q4_K_M.gguf  # GGUF 模型路径

speller:
  #编码唯一自动上屏
  auto_select: false
  #超最大码长重新编码
  #auto_clear: max_length
  max_code_length: 4
  alphabet: 'abcdefghijklmnopqrstuvwxyz'
  delimiter: " "
  algebra:

translator:
  dictionary: pdsp
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: true
  enable_encoder: true
  enable_commit_history: true
  max_phrase_length: 5
  disable_user_dict_for_patterns:
    - '^.{1,3}$'
  preedit_format:
    - xform/.*//
  comment_format:
    - xform/.*//

key_binder:
  bindings:
    #翻页，可选comma、period
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: has_menu, accept: Tab, send: Page_Down }
    #次选
    - { when: has_menu, accept: semicolon, send: 2 }
    #退格当清屏用
    - { when: composing, accept: BackSpace, send: Escape }

punctuator:
  import_preset: symbols_pd
  digit_separators: ""

recognizer:
  patterns:
    punct: '^\\([0-9][01]?|[A-Za-z]+)?$'
